services:
  larddb:
    image: postgres
    container_name: lard_postgres
    ports:
      - 5432:5432
      - 3000:3000 # published here, but used by egress
    environment:
      - POSTGRES_PASSWORD=postgres

  lardegress:
    build: egress # make own ubuntu since need certs for https
    container_name: lard_egress
    network_mode: "service:larddb" # This container shares the network of larddb
    depends_on:
      - larddb
    command: ["sh", "-c", "sleep 5 && setup_test_environment && lard_egress --verbose"] # waiting for larddb
    environment:
      - PG_CONN_STRING=${PG_CONN_STRING_DOCKER}
      - FROST_DATA=true
      - LARD_CONN_STRING=${LARD_CONN_STRING_DOCKER}
      - LARD_RESTRICTED_CONN_STRING=${LARD_RESTRICTED_CONN_STRING_DOCKER}
      - LARD_READONLY_CONN_STRING=${LARD_CONN_STRING_DOCKER}
      - LARD_READONLY_RESTRICTED_CONN_STRING=${LARD_RESTRICTED_CONN_STRING_DOCKER}
      - STINFO_CONN_STRING=***replace_me***
      - JWKS_URL=***replace_me***
      - PARAMCONV_CSV=/resources/paramconversions.csv
      - AWS_REGION=us-east-1
      - S3_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - S3_BUCKET_NAME=test
    volumes:
      - ../../db/:/db/
      - ../../target/debug/setup_test_environment:/usr/local/bin/setup_test_environment
      - ../../target/debug/lard_egress:/usr/local/bin/lard_egress
      - ../../resources:/resources:ro        

  localstack:
    image: localstack/localstack
    container_name: lard_localstack
    ports:
      - 4566:4566
    environment:
      - SERVICES=s3
      - GATEWAY_LISTEN=0.0.0.0:4566

  authdb:
    image: postgres:13 # TODO: figure out how turn on ssl on postgres docker image?
    container_name: authdb_postgres
    ports:
      - 5433:5432
    environment:
      - POSTGRES_DB=authdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./authdb/authdb.sql:/docker-entrypoint-initdb.d/init.sql

  frost:
    image: registry.met.no/frost/frost/lard:lard10 # had to disable ssl for the authdb conn in this image
    container_name: frost
    depends_on:
      - larddb
      - authdb
    ports:
      - 8080:8080
    entrypoint: sh -c "sleep 15 && /app/frost" # need to sleep to wait for larddb with some data to exist
    volumes:
      - ./stinfomock:/app/internal/routes/api/obs/timeseries/met.no/:ro
    environment:
      - OBSBACKEND=lard
      - FEATURES=lardbase,lardranked
      - LARDSBHOST=larddb
      - LARDPGPORT=5432
      - LARDPGPASSWORD=postgres
      - LARDPGUSER=postgres 
      - AUTHENABLED=true
      - CLIENTAUTHENABLED=true 
      - STINFOMOCKUP=true # frost does not use the real stinfosys, uses the file in stinfomock
      - AUTHDBHOST=authdb
      - AUTHDBNAME=authdb
      - AUTHDBUSER=postgres
      - AUTHDBPASSWORD=postgres
      - KEYCLOAK_SERVER=https://login.met.no
      - CLIENT_ID=XXXX # not needed currently, maybe if test restricted
      - CLIENT_SECRET=XXXX
