---
- name: Cleanup localhost's `known_hosts`
  hosts: lard
  gather_facts: false
  serial: 1
  tasks:
    - name: Remove hostkeys
      ansible.builtin.known_hosts:
        name: "{{ ansible_host }}"
        state: absent
      delegate_to: localhost
      tags: ssh

- name: Teardown
  hosts: lard
  gather_facts: false
  tasks:
    - name: Remove VMs
      openstack.cloud.server:
        cloud: "{{ ostack_cloud }}"
        region_name: "{{ ostack_region }}"
        name: "{{ inventory_hostname }}"
        state: absent
      delegate_to: localhost
      tags: vm

    - name: Remove Volumes
      openstack.cloud.volume:
        cloud: "{{ ostack_cloud }}"
        region_name: "{{ ostack_region }}"
        name: "{{ inventory_hostname }}"
        state: absent
      delegate_to: localhost
      tags: volume
