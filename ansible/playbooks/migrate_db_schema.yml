# This playbook applies a named database schema migration on the primary node. It can be used to apply a schema migration or to roll back a schema migration.
# usage: uv run ansible-playbook -i staging.yml playbooks/migrate_db_schema.yml -e migration_name=001-timeresolution -e migration_type=up
---
- name: Validate migration locally
  hosts: localhost
  gather_facts: false

  vars:
    migration_type: "{{ migration_type }}"
    migration_file_name: "{{ migration_name ~ '.sql' }}"
    migration_source_path: "{{ playbook_dir }}/../../db/migrations/{{ migration_type }}/{{ migration_file_name }}"

  tasks:
    - name: Check migration file exists
      ansible.builtin.stat:
        path: "{{ migration_source_path }}"
      register: migration_file

    - name: Fail if migration file is missing
      ansible.builtin.assert:
        that:
          - migration_file.stat.exists
        fail_msg: "Migration file not found: {{ migration_source_path }}"

- name: Apply a named database migration on the primary node
  # primary node is defined in the inventory file (staging.yml or production.yml)
  # check that it is still correct (since we could have switched it)
  hosts: lard
  remote_user: ubuntu
  gather_facts: false

  vars:
    ansible_python_interpreter: "{{ ostack_mount_point }}/.venv/postgres/bin/python3"
    migration_type: "{{ migration_type }}"
    migration_file_name: "{{ migration_name ~ '.sql' }}"
    migration_source_path: "{{ playbook_dir }}/../../db/migrations/{{ migration_type }}/{{ migration_file_name }}"

  tasks:
  # turn off the egress service so that it does not try to read the database while we are migrating it
  - name: Stop the egress service on all nodes # it should only be running on the secondaries
    ansible.builtin.systemd_service:
      daemon_reload: true
      name: lard_egress
      state: stopped
    become: true

  # no writes to the db while migrating the schema...
  - name: Stop LARD ingestion service on all nodes # it should only be running on the primary
    ansible.builtin.systemd_service:
      daemon_reload: true
      name: lard_ingestion
      state: stopped
    become: true

  - name: Migrate the schema on the primary node (will replicate to secondaries)
    when: inventory_hostname == primary
    become: true
    become_user: postgres
    block: 
      - name: Create temporary directory for migration file
        when: inventory_hostname == primary
        ansible.builtin.tempfile:
          state: directory
          prefix: lard-migration-
        register: migration_tmpdir

      - name: Copy migration file to primary host
        when: inventory_hostname == primary
        ansible.builtin.copy:
          src: "{{ migration_source_path }}"
          dest: "{{ migration_tmpdir.path }}/{{ migration_file_name }}"

      - name: Apply the selected migration to both the lard and lard_restricted databases
        when: inventory_hostname == primary
        community.postgresql.postgresql_script:
          login_db: "{{ item }}"
          path: "{{ migration_tmpdir.path }}/{{ migration_file_name }}"
        loop:
          - lard
          - lard_restricted

      - name: Remove temporary migration directory
        when: inventory_hostname == primary
        ansible.builtin.file:
          path: "{{ migration_tmpdir.path }}"
          state: absent

