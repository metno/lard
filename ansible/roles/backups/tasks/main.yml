---
- name: Install s3cmd
  become: true
  ansible.builtin.apt:
    pkg:
      - s3cmd
    update_cache: true

- name: Move s3 config file # needs to be decrypted before its moved
  become: true
  ansible.builtin.copy:
    src: vault/.s3cfg
    dest: /home/ubuntu/
    mode: "0755"

- name: Setup backup cron jobs
  when: backups_enabled
  block:
    - name: Move backup shell scripts
      become: true
      ansible.builtin.copy:
        src: cron_scripts/
        dest: /home/ubuntu/cron_scripts
        mode: "0755"

    # backup to s3 in lard/backups bucket
    # the db(s) get backed up weekly, and globals and stinfo backed up monthly
    - name: Install backup systemd services
      become: true
      ansible.builtin.template:
        src: "ini-service/{{ item }}.service"
        dest: "/etc/systemd/system/{{ item }}.service"
        owner: root
        group: root
        mode: "0644"
      loop:
        - lard_backup
        - lard_restricted_backup
        - globals_backup
        - stinfo_backup

    - name: Install backup systemd timers
      become: true
      ansible.builtin.template:
        src: "ini-timer/{{ item }}.timer"
        dest: "/etc/systemd/system/{{ item }}.timer"
        owner: root
        group: root
        mode: "0644"
      loop:
        - lard_backup
        - lard_restricted_backup
        - globals_backup
        - stinfo_backup

    - name: Reload systemd
      become: true
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Enable and start backup timers
      become: true
      ansible.builtin.systemd_service:
        name: "{{ item }}.timer"
        enabled: true
        state: started
      loop:
        - lard_backup
        - lard_restricted_backup
        - globals_backup
        - stinfo_backup
