## this task takes a long time, so we do it in a tmux?
- name: Unzip backup to data dir
  vars:
    data_dir: "{{ recovery_mount_point }}/postgresql/{{ recovery_pg_version }}/main"
  ansible.builtin.command: "pigz -d -c {{ recovery_mount_point }}/20250514132819.gz | {{ data_dir }}"
  become: true
  become_user: postgres
  changed_when: false
  async: 18000 # hopefully lets it not timeout on the connection?
  poll: 0
  register: unzip_backup_data

## https://docs.ansible.com/ansible/latest/collections/ansible/builtin/async_status_module.html
- name: Check if unzip_backup_data complete
  become: true
  become_user: postgres
  ansible.builtin.async_status:
    jid: "{{ unzip_backup_data.ansible_job_id }}"
  register: job_result
  until: job_result.finished
  retries: 600
  delay: 30

- name: Clean up async file
  ansible.builtin.async_status:
    jid: '{{ unzip_backup_data_dir.ansible_job_id }}'
    mode: cleanup

- name: Setup as standalone
  when:
    - recovery_standalone
    - inventory_hostname == "lard-staging" # only if on staging?
  block:
    # remove lines about primary slot (if trying to bring up standalone)
    - name: Edit postgres.auto.conf to remove primary_conninfo
      remote_user: postgres
      ansible.builtin.lineinfile:
        path: "{{ recovery_mount_point }}/postgresql/{{ recovery_pg_version }}/main/postgres.auto.conf"
        search_string: 'primary_conninfo'
        state: absent
    - name: Edit postgres.auto.conf to remove primary_slot_name
      remote_user: postgres
      ansible.builtin.lineinfile:
        path: "{{ recovery_mount_point }}/postgresql/{{ recovery_pg_version }}/main/postgres.auto.conf"
        search_string: 'primary_slot_name'
        state: absent
    # remove standby.signal (if trying to bring up standalone)
    - name: Remove file standby.signal
      remote_user: postgres
      ansible.builtin.file:
        path: "{{ recovery_mount_point }}/postgresql/{{ recovery_pg_version }}/main/standby.signal"
        state: absent

# this hopefully is what is needed when not using for standalone on staging...
- name: Setup in recovery
  when:
    - not recovery_standalone
    - inventory_hostname != "lard-staging" # probably never want to do this on staging?
  block:
    - name: Create recovery.signal
      remote_user: postgres
      ansible.builtin.file:
        path: "{{ recovery_mount_point }}/postgresql/{{ recovery_pg_version }}/main/recovery.signal"
        state: touch
        mode: u=rw,g=r,o=r
    - name: Edit postgresql.conf to add restore_command
      remote_user: postgres
      ansible.builtin.lineinfile:
        path: "/etc/postgresql/{{ recovery_pg_version }}/main/postgres.auto.conf"
        search_string: 'restore_command'
        # NOTE: this should be changed to the location of any saved wall files from the failed DB
        line: restore_command = 'cp /mnt/server/archivedir/%f %p'

- name: Start postgres
  ansible.builtin.systemd_service:
    name: postgresql
    state: started
  become: true
