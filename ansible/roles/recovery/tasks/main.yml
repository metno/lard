---
# lots of this would need to be changed for doing a restore on the cluster
# currently making this so it can be used on staging
- name: Check if basebackup file is already there
  ansible.builtin.stat:
    # NOTE: lookup the name of the latest basebackup
    path: "{{ recovery_mount_point }}/20250514132819.gz"
    get_checksum: false # otherwise takes ages for large files...
  register: register_base

- name: File exists?
  ansible.builtin.debug:
    msg: "The file basebackup exists"
  when: register_base.stat.exists

- name: Copy base file to server from s3
  when: not register_base.stat.exists # file does not already exist
  amazon.aws.s3_object:
    aws_access_key: "{{ aws_access_key }}"
    aws_secret_key: "{{ aws_secret_key }}"
    bucket: lard
    object: backups/basebackup/20250514132819.gz
    dest: "{{ recovery_mount_point }}/20250514132819.gz"
    mode: get
    rgw: true
    s3_url: "{{ s3_url }}"

- name: Print out move_backup_from_s3
  ansible.builtin.debug:
    var: move_backup_from_s3.stderr_lines

- name: Change ownership of file
  ansible.builtin.file:
    path: "{{ recovery_mount_point }}/20250514132819.gz"
    owner: postgres
    group: postgres
    mode: "0775"
  become: true

- name: Install apt packages
  ansible.builtin.apt:
    pkg:
      - pigz
    update_cache: true
  become: true

# - name: Install pip packages
#  ansible.builtin.pip:
  # NOTE: this is a "problem" in Ubuntu 24.04+ since they started applying PEP 668.
#    virtualenv: "{{ recovery_mount_point }}/.venv/postgres"
#    virtualenv_command: "/usr/bin/python3 -m venv"
#    name:
#      - rapidgzip

- name: Stop postgres
  ansible.builtin.systemd_service:
    name: postgresql
    state: stopped
  become: true

# TODO: first maybe want to back up data dir, or at least the wal files elsewhere
# especially if this is a failed DB we are trying to recover
# hard to have enough space on the VM...
- name: Delete data dir
  become: true
  become_user: postgres
  ansible.builtin.file:
    path: "{{ recovery_mount_point }}/postgresql/{{ recovery_pg_version }}/main"
    state: absent
  changed_when: false

- name: Ensure the directory exists
  become: true
  become_user: postgres
  ansible.builtin.file:
    path: "{{ recovery_mount_point }}/postgresql/{{ recovery_pg_version }}/main"
    state: directory
    mode: u=rwx,g=rx,o=rx
  changed_when: false

