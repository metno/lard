---
# https://www.repmgr.org/docs/current/quickstart-repmgr-user-database.html
- name: Create repmgr user
  community.postgresql.postgresql_user:
    name: repmgr
    # NOTE: single quotes are mandatory here!
    password: '{{ pg_repmgr_password }}'
    # We should consider restricting these permissions. Relevant repmgr doc:
    # https://www.repmgr.org/docs/5.3/configuration-permissions.html
    role_attr_flags: SUPERUSER
  become: true
  become_user: postgres

- name: Create a repmgr database, with owner repmgr
  community.postgresql.postgresql_db:
    name: repmgr
    owner: repmgr
  become: true
  become_user: postgres

# TODO: use pg_ctlcluster instead of systemctl? Recommended by the repmgr docs
# https://www.repmgr.org/docs/4.0/configuration-service-commands.html
- name: Allow the postgres user to run /bin/systemctl restart, stop, start postgres
  community.general.sudoers:
    name: postgresql
    user: postgres
    commands:
      - /bin/systemctl restart postgresql.service
      - /bin/systemctl stop postgresql.service
      - /bin/systemctl start postgresql.service
      - /bin/systemctl reload postgresql.service
    nopassword: true
  become: true

- name: Create repmgr.conf
  ansible.builtin.template:
    src: templates/repmgr.j2
    dest: "/etc/repmgr.conf"
    mode: "0755"
  become: true
  notify: Restart postgres service

# Allows nodes to authenticate as repmgr with each other when setting up
# replication
- name: Create .pgpass
  ansible.builtin.template:
    src: templates/pgpass.j2
    # Normally this should go in `~/.pgpass`, but we seem to be running repmgr
    # from the postgres user, which doesn't have a home dir. If I try running
    # as ubuntu I get a permission error on the data dir. The repmgr docs seem
    # to recommend using pgpass, and don't mention running as the postgres user
    # so maybe our permissions on the data dir aren't right?
    dest: /etc/postgresql/{{ pg_version }}/main/pgpass
    mode: "0600"
    owner: postgres
    group: postgres
  become: true

# Make sure any configuration changes are applied before moving on
- name: Flush handlers
  ansible.builtin.meta: flush_handlers
