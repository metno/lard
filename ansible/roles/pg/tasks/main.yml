---
- name: Format VMs
  ansible.builtin.import_role:
    name: ostack
    tasks_from: format_vm.yml
  tags: format

- name: Set postgres facts
  ansible.builtin.set_fact:
    pg_dir: "{{ pg_mount_point }}/postgresql/{{ pg_version }}/main"
    pg_venv: "{{ pg_mount_point }}/.venv/postgres"

- name: Install postgres
  ansible.builtin.import_tasks: configure/install_postgres.yml

# Needed to disable certain tasks, as replicas are read-only and can't run them
- name: Discover replication status
  community.postgresql.postgresql_query:
    db: "lard"
    login_host: "localhost"
    login_user: "lard_user"
    login_password: "{{ pg_lard_password }}"
    query: SELECT * FROM pg_stat_wal_receiver
  register: pg_stat_wal_receiver
  # This will fail on first run, as the lard user and db are not yet created. In this case
  # the following task will assume is_replica as false
  ignore_errors: true

- name: Set replication status fact
  ansible.builtin.set_fact:
    pg_is_replica: "{{ (pg_stat_wal_receiver.rowcount | default(0)) == 1 }}"

- name: Configure repmgr
  ansible.builtin.import_tasks: configure/repmgr.yml
  when: not pg_is_replica

- name: Setup primary and standby
  when: inventory_hostname != "lard-staging" # don't do this part for staging
  block:
    # This needs to be done after postgres installation
    - name: Share postgres SSH keys
      ansible.builtin.import_tasks: configure/ssh.yml

    - name: Create primary
      when:
        - ansible_host == pg_primary_ip
        - not pg_is_replica
      block:
        - name: Setup primary DB
          ansible.builtin.import_tasks: configure/create_primary.yml

        - name: Attach ipalias IP to the primary
          ansible.builtin.import_role:
            name: ostack
            tasks_from: attach_floating_ip.yml
          delegate_to: localhost

    - name: Create standby
      ansible.builtin.import_tasks: configure/create_standby.yml
      when:
        - ansible_host != pg_primary_ip
        - not pg_is_replica
