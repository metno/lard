---
- name: Create lard group
  ansible.builtin.group:
    name: lard
    state: present
  become: true

- name: Create lard user
  ansible.builtin.user:
    name: lard
    groups: lard
    shell: /sbin/nologin
    append: true
    state: present
    create_home: false
  become: true

- name: Copy files to server (root)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
    owner: root
    group: root
  become: true
  loop:
    # TODO: these permissions are probably wrong?
    - src: "{{ playbook_dir }}/../../target/release/lard_ingestion"
      dest: /usr/local/bin
      mode: "0755"
    - src: lard_egress.service
      dest: /etc/systemd/system
      mode: "0664"
    - src: "{{ playbook_dir }}/../../target/release/lard_egress"
      dest: /usr/local/bin
      mode: "0755"

- name: Make ubuntu home dir accessible
  ansible.builtin.file:
    path: /home/ubuntu
    state: directory
    mode: "0755"
  become: true

- name: Create lard-data dir
  ansible.builtin.file:
    path: /home/ubuntu/lard-data
    state: directory
    owner: lard
    group: lard
    mode: "0755"
  become: true

- name: Copy assets to server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../resources/assets"
    dest: /home/ubuntu/lard-data/
    mode: "0664"
    owner: lard
    group: lard
  become: true

# we currently don't need to copy anything as lard, but let's keep this
# in case we need to in the future
