- name: Copy templates to server
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
    owner: root
    group: root
  become: true
  loop:
    - src: templates/lard_ingestion.service.j2
      dest: /etc/systemd/system/lard_ingestion.service
      mode: "0664"
    - src: templates/vault/var_file.j2
      dest: /etc/systemd/lard.var
      mode: "0600"

- name: Handle primary services
  when: inventory_hostname == deploy_primary
  block:
    - name: Start and enable LARD ingestion service
      ansible.builtin.systemd_service:
        daemon_reload: true
        name: lard_ingestion
        state: restarted
        enabled: true
      become: true

    - name: Stop and disable LARD egress service
      ansible.builtin.systemd_service:
        daemon_reload: true
        name: lard_egress
        state: stopped
        enabled: false
      become: true

- name: Handle replica services
  when: inventory_hostname != deploy_primary
  block:
    - name: Stop and disable LARD ingestion service
      ansible.builtin.systemd_service:
        daemon_reload: true
        name: lard_ingestion
        state: stopped
        enabled: false
      become: true

    - name: Start and enable LARD egress service
      ansible.builtin.systemd_service:
        daemon_reload: true
        name: lard_egress
        state: restarted
        enabled: true
      become: true
