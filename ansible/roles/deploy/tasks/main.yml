---
- name: Create lard group
  ansible.builtin.group:
    name: lard
    state: present
  become: true

- name: Create lard user
  ansible.builtin.user:
    name: lard
    groups: lard
    shell: /sbin/nologin
    append: true
    state: present
    create_home: false
  become: true

- name: Copy files to server
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
    # TODO: should these belong to 'lard'?
    owner: root
    group: root
  become: true
  loop:
    # TODO: these permissions are probably wrong?
    - src: vault/var_file
      dest: /etc/systemd/lard.var
      mode: "0600"
    - src: "{{ playbook_dir }}/../../target/release/lard_ingestion"
      dest: /usr/local/bin
      mode: "0755"
    - src: "{{ playbook_dir }}/../../resources"
      dest: /usr/local/bin
      mode: "0755"
    - src: "{{ playbook_dir }}/../../qc_pipelines"
      dest: /usr/local/bin
      mode: "0755"
    - src: lard_egress.service
      dest: /etc/systemd/system
      mode: "0664"
    - src: "{{ playbook_dir }}/../../target/release/lard_egress"
      dest: /usr/local/bin
      mode: "0755"

- name: Copy templates to server
  ansible.builtin.template:
    src: templates/lard_ingestion.service.j2
    dest: /etc/systemd/system/lard_ingestion.service
    mode: "0664"
    owner: root
    group: root
  become: true

- name: Handle primary services
  when:
    - inventory_hostname == deploy_primary
    - (groups['lard'] | length) > 1
  block:
    - name: Start and enable LARD ingestion service
      ansible.builtin.systemd_service:
        daemon_reload: true
        name: lard_ingestion
        state: restarted
        enabled: true
      become: true

    - name: Stop and disable LARD egress service
      ansible.builtin.systemd_service:
        daemon_reload: true
        name: lard_egress
        state: stopped
        enabled: false
      become: true

- name: Handle replica services
  when:
    - inventory_hostname != deploy_primary
    - (groups['lard'] | length) > 1
  block:
    - name: Stop and disable LARD ingestion service
      ansible.builtin.systemd_service:
        daemon_reload: true
        name: lard_ingestion
        state: stopped
        enabled: false
      become: true

    - name: Start and enable LARD egress service
      ansible.builtin.systemd_service:
        daemon_reload: true
        name: lard_egress
        state: restarted
        enabled: true
      become: true

- name: Handle single node services
  when: (groups['lard'] | length) == 1
  block:
    - name: Start and enable LARD ingestion service
      ansible.builtin.systemd_service:
        daemon_reload: true
        name: lard_ingestion
        state: restarted
        enabled: true
      become: true

    - name: Start and enable LARD egress service
      ansible.builtin.systemd_service:
        daemon_reload: true
        name: lard_egress
        state: restarted
        enabled: true
      become: true
