[project]
name = "ansible"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "ansible-core~=2.17.4",
    "ansible-lint~=25.8.1",
    "netaddr~=0.7.19",
    "openstacksdk~=4.3.0",
    # not sure we actually need psycopg? the pg playbooks run from the remote hosts and include
    # code to install psycopg there. I guess it's useful to have for dev though
    "psycopg[binary]>=3.2.9",
    "python-openstackclient~=7.2.1",
    "wheel>=0.45.1",
]
