---
# ansible-playbook -v -i inventory.yml -e ostack_key_name=___ staging.yml --ask-pass --ask-vault-pass
- name: Create staging
  hosts: staging
  gather_facts: false
  vars:
    # set here or provide via cmd, '-e ostack_key_name=...'
    ostack_key_name: # label for the key on Ostack to use to create the VMs
  tasks:
    - name: Create VMs
      ansible.builtin.import_role:
        name: ostack
        tasks_from: create_vm.yml
      delegate_to: localhost
      tags: vm

- name: Format staging
  hosts: staging
  remote_user: ubuntu
  gather_facts: true
  vars:
    pg_version: 17
    pg_mount_point: "{{ ostack_mount_point }}"
  roles:
    - role: staging
