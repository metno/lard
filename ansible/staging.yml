---
# ansible-playbook -v -i inventory.yml -e ostack_key_name=___ staging.yml --ask-pass --ask-vault-pass
- name: Create staging
  hosts: staging
  gather_facts: false
  vars:
    # set here or provide via cmd, '-e ostack_key_name=...'
    ostack_key_name: # label for the key on Ostack to use to create the VMs
  tasks:
    - name: Create VMs
      ansible.builtin.import_role:
        name: ostack
        tasks_from: create_vm.yml
      delegate_to: localhost
      tags: vm

- name: Format staging
  hosts: staging
  remote_user: ubuntu
  gather_facts: true
  roles:
    - role: pg
      vars:
        pg_version: 17
        pg_mount_point: "{{ ostack_mount_point }}"

- name: Set up node and postgres exporters
  hosts: staging
  remote_user: ubuntu
  gather_facts: true
  tags: exporters
  roles:
    - role: prometheus.prometheus.node_exporter
      node_exporter_web_listen_address: "0.0.0.0:9001"
    - role: prometheus.prometheus.postgres_exporter
      postgres_exporter_name: "postgresql://lard_user:{{ pg_lard_password }}@localhost/lard"
      postgres_exporter_web_listen_address: "0.0.0.0:9002"
      postgres_exporter_enabled_collectors: ["stat_statements"]

- name: Set up backups (for staging, means s3 config is setup)
  hosts: staging
  remote_user: ubuntu
  gather_facts: true
  tags: backups
  roles:
    - role: backups
