name: Continuous integration

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: xom9ikk/dotenv@v2.3.0
        with:
          path: integration_tests
          mode: test

      - name: Start LocalStack
        uses: LocalStack/setup-localstack@v0.2.3
        with:
          image-tag: 'latest'
          install-awslocal: 'true'
          configuration: "SERVICES=s3"

      - name: Create S3 bucket
        run: awslocal s3 mb s3://$S3_BUCKET_NAME

      - name: Cargo cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Run cargo check
        run: cargo check

      - name: Formatting check
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace --tests

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Prepare testing environment
        run: target/debug/setup_test_environment

      - name: Run unit and integration tests
        run: cargo test --no-fail-fast -- --nocapture --test-threads=1

      - name: Setup Go 1.22.x
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: migrations/go.sum

      - name: Install Go dependencies
        working-directory: migrations
        run: go get

      - name: Build migration package
        working-directory: migrations
        run: go build -v ./...

      - name: Run Go tests
        working-directory: migrations
        run: go test -v ./...

  ansible-format:
    name: Check yaml formatting of ansible files
    runs-on: ubuntu-latest
    container: ghcr.io/google/yamlfmt:latest
    steps:
      - uses: actions/checkout@v4

      - name: Check yaml format
        working-directory: ansible
        run: yamlfmt -lint

  ansible-lint:
    name: Lint ansible files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ansible-lint
        uses: ansible/ansible-lint@main
        with:
          setup_python: "true"
          working_directory: "ansible"
          requirements_file: "requirements.yml"
