when:
  - event: push
    branch: main
  - event: [pull_request, manual]

steps:
  test:
    when:
      event: [push, pull_request, manual]
    image: rust
    environment:
      CARGO_TERM_COLOR: always
    commands:
      - rustup component add clippy
      - cargo clippy -j 4 --workspace -- -D warnings
