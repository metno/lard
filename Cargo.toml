[workspace]
members = [
  "egress",
  "ingestion",
  "integration_tests",
  "rove_connector",
  "util",
  "report_importer",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
async-trait = "0.1.89"
axum = "0.8.3"
bb8 = "0.8.6"
bb8-postgres = "0.8.1"
bytes = "1.10.1"
chrono = { version = "0.4.41", features = ["serde"] }
chronoutil = "0.2.7"
csv = "1.3.1"
futures = "0.3.28"
metrics = "0.24.2"
metrics-exporter-prometheus = "0.16.2"
postgres-types = { version = "0.2.8", features = ["derive", "with-chrono-0_4"] }
quick-xml = { version = "0.35.0", features = [ "serialize", "overlapped-lists" ] }
rdkafka = "0.37.0"
regex = "1.11.2"
rove = "0.2.1"
rust-s3 = "0.35.1"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-postgres = { version = "0.7.12", features = ["with-chrono-0_4"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
toml = "0.8.23"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
tower-http = { version = "0.6.6", features = ["compression-full"] }
reqwest = { version = "0.12.23", features = ["json"] }
http = "1.3.1"
jsonwebtoken = "9.3.1"
