[workspace]
members = [
  "egress",
  "ingestion",
  "integration_tests",
  "load_test",
  "rove_connector",
  "util",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
async-trait = "0.1.88"
axum = "0.8.3"
bb8 = "0.8.6"
bb8-postgres = "0.8.1"
bytes = "1.10.1"
chrono = { version = "0.4.41", features = ["serde"] }
chronoutil = "0.2.7"
csv = "1.3.1"
futures = "0.3.28"
goose = "0.18.0"
metrics = "0.24.2"
metrics-exporter-prometheus = "0.16.2"
postgres-types = { version = "0.2.8", features = ["derive", "with-chrono-0_4"] }
quick-xml = { version = "0.35.0", features = [ "serialize", "overlapped-lists" ] }
rand = "0.9.1"
rand_distr = "0.5.1"
rdkafka = "0.37.0"
regex = "1.11.1"
reqwest = {version = "0.12.15", features = ["json"]}
rove = "0.2.1"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["rt-multi-thread", "macros", "signal"] }
tokio-postgres = { version = "0.7.12", features = ["with-chrono-0_4"] }
tokio-util = { version = "0.7.15", features = ["rt"] }
toml = "0.8.22"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
