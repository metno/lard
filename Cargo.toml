[workspace]
members = [
  "egress",
  "ingestion",
  "integration_tests",
  "rove_connector",
  "util",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
async-trait = "0.1.89"
axum = "0.8.6"
bb8 = "0.9.0"
bb8-postgres = "0.9.0"
bytes = "1.10.1"
chrono = { version = "0.4.42", features = ["serde"] }
chronoutil = "0.2.7"
csv = "1.4.0"
futures = "0.3.28"
metrics = "0.24.2"
metrics-exporter-prometheus = "0.17.2"
postgres-types = { version = "0.2.8", features = ["derive", "with-chrono-0_4"] }
quick-xml = { version = "0.38.3", features = [ "serialize", "overlapped-lists" ] }
rdkafka = "0.38.0"
regex = "1.12.2"
rove = "0.3.0"
rust-s3 = "0.37.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "signal"] }
tokio-postgres = { version = "0.7.15", features = ["with-chrono-0_4"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
toml = "0.9.6"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
tower-http = { version = "0.6.6", features = ["compression-full"] }
reqwest = { version = "0.12.24", features = ["json"] }
http = "1.3.1"
jsonwebtoken = { version = "10.1.0", features = ["rust_crypto"] }
