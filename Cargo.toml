[workspace]
members = [
  "egress",
  "drops",
  "ingestion",
  "integration_tests",
  "rove_connector",
  "util",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
async-trait = "0.1.86"
axum = "0.7.9"
bb8 = "0.8.6"
bb8-postgres = "0.8.1"
bytes = "1.9.0"
chrono = { version = "0.4.40", features = ["serde"] }
chronoutil = "0.2.7"
csv = "1.3.1"
futures = "0.3.28"
jsonschema = "0.29.1"
metrics = "0.24.1"
metrics-exporter-prometheus = "0.16.2"
postgres-types = { version = "0.2.8", features = ["derive", "with-chrono-0_4"] }
quick-xml = { version = "0.35.0", features = [ "serialize", "overlapped-lists" ] }
rand = "0.9.0"
rand_distr = "0.5.1"
rdkafka = "0.37.0"
regex = "1.11.1"
rove = { git = "https://github.com/metno/rove.git" }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = { version = "1.0.140" }
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "signal"] }
tokio-postgres = { version = "0.7.12", features = ["with-chrono-0_4"] }
tokio-util = { version = "0.7.13", features = ["rt"] }
toml = "0.8.19"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
